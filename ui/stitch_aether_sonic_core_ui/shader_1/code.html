<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:"#ffba20"}}}}</script>
</head>
<body class="bg-black text-white overflow-hidden">
<canvas id="c" class="fixed inset-0 w-full h-full"></canvas>
<script>
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const vs = `attribute vec2 a; void main(){gl_Position=vec4(a,0,1);}`;
const fs = `precision mediump float; uniform float t; uniform vec2 r; void main(){vec2 p=(gl_FragCoord.xy*2.-r)/min(r.x,r.y); float d=length(p); float a=atan(p.y,p.x); float c=0.5+0.5*sin(d*10.-t*2.+a*3.); gl_FragColor=vec4(c*0.8,c*0.4,c*0.1,1.);}`;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,vs));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,"a");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const uT=gl.getUniformLocation(prog,"t");
const uR=gl.getUniformLocation(prog,"r");
function frame(t){gl.uniform1f(uT,t/1000);gl.uniform2f(uR,canvas.width,canvas.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
window.onresize=()=>{canvas.width=innerWidth;canvas.height=innerHeight;};
</script>
</body>
</html>
