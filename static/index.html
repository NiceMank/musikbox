<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MusikBox — Votre lecteur multimédia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e8b36a'/%3E%3Cstop offset='1' stop-color='%237c4f20'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%2317100a'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23f2cd8f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">

  <!-- ============ BARRE LATÉRALE (style Spotify) ============ -->
  <aside class="sidebar glass" id="sidebar">
    <a class="brand" href="#/">
      <span class="brand-disc" aria-hidden="true"></span>
      <span class="brand-text">Musik<em>Box</em></span>
    </a>

    <nav class="side-nav">
      <a href="#/" data-nav="home">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        Accueil</a>
      <a href="#/recherche" data-nav="recherche">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        Rechercher</a>
      <a href="#/bibliotheque" data-nav="bibliotheque">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V5l12-2v15"/><path d="M16 5l4-1v15"/><path d="M4 20h16"/></svg>
        Ma bibliothèque <span id="lib-count" class="pill">0</span></a>
      <a href="#/favoris" data-nav="favoris">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.7-9.6-9.3C.8 8.4 2.8 4.5 6.6 4.1c2-.2 3.9.8 5.4 2.6 1.5-1.8 3.4-2.8 5.4-2.6 3.8.4 5.8 4.3 4.2 7.6C19.5 16.3 12 21 12 21z"/></svg>
        Favoris <span id="fav-count" class="pill">0</span></a>
      <a href="#/playlists" data-nav="playlists">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h8v2H3z"/><path d="M17 9v8l5-4z"/></svg>
        Playlists <span class="pill smart">IA</span></a>
      <a href="#/telechargements" data-nav="telechargements">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 21h16"/></svg>
        Téléchargements <span id="dl-count" class="pill" hidden>0</span></a>
    </nav>

    <div class="side-foot">
      <div class="side-status"><span class="dot"></span> Serveur local actif</div>
      <div class="side-note">Écoutez, téléchargez, gardez vos sons.</div>
    </div>
  </aside>

  <!-- ============ COLONNE PRINCIPALE ============ -->
  <div class="main-col">
    <header class="topbar glass">
      <button class="icon-btn burger" id="burger" aria-label="Menu">☰</button>
      <form id="search-form" class="search glass-inset" autocomplete="off">
        <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Rechercher sons, artistes, vidéos…" aria-label="Recherche">
        <div id="suggestions" class="suggest glass" hidden></div>
      </form>
      <div class="top-right">
        <span class="top-clock" id="top-clock"></span>
      </div>
    </header>

    <main id="view" class="container"></main>
  </div>
</div>

<!-- ============ CINÉMA (lecteur vidéo) ============ -->
<div id="cinema" class="cinema" hidden>
  <div class="cinema-bar glass-strong">
    <div class="cinema-title">
      <span class="badge-video">🎬 VIDÉO</span>
      <span id="cinema-title" class="cinema-name">—</span>
    </div>
    <div class="cinema-actions">
      <button class="icon-btn" id="cinema-fs" title="Plein écran">⛶</button>
      <button class="icon-btn" id="cinema-close" title="Fermer">✕</button>
    </div>
  </div>
  <div class="cinema-stage glass-strong" id="cinema-stage">
    <video id="media" playsinline></video>
  </div>
</div>

<!-- ============ MODALE DÉTAIL ============ -->
<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal glass-strong" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<!-- ============ FILE D'ATTENTE ============ -->
<div id="queue-panel" class="queue-panel glass-strong" hidden>
  <div class="queue-head">
    <strong>File d'attente</strong>
    <span id="queue-count" class="pill"></span>
    <button class="icon-btn" id="queue-clear" title="Vider la file">🗑</button>
    <button class="icon-btn" id="queue-close" aria-label="Fermer">✕</button>
  </div>
  <div id="queue-list" class="queue-list"></div>
</div>

<!-- ============ LECTEUR ============ -->
<footer class="player" id="player" hidden>
  <div class="player-main">
    <div class="player-left">
      <div class="cover-wrap" id="cover-wrap">
        <img id="player-cover" alt="pochette">
        <div class="cover-spin" aria-hidden="true"></div>
      </div>
      <div class="player-meta">
        <div class="player-title" id="player-title">—</div>
        <div class="player-sub" id="player-sub">
          <span class="badge-local" id="badge-local" hidden>◉ Local</span>
          <span class="badge-stream" id="badge-stream" hidden>◌ Streaming</span>
          <span class="badge-video-sm" id="badge-video" hidden>🎬 Vidéo</span>
        </div>
      </div>
    </div>

    <div class="player-center">
      <div class="controls">
        <button class="ctl" id="btn-prev" title="Précédent" aria-label="Précédent">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
        </button>
        <button class="ctl ctl-play" id="btn-play" title="Lecture / Pause" aria-label="Lecture / Pause">
          <svg id="ico-play" viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="ico-pause" viewBox="0 0 24 24" width="26" height="26" fill="currentColor" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>
        <button class="ctl" id="btn-next" title="Suivant" aria-label="Suivant">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
        </button>
      </div>
      <div class="timeline">
        <span class="t" id="t-current">0:00</span>
        <div class="bar" id="seek-bar"><div class="bar-fill" id="seek-fill"></div><div class="bar-thumb" id="seek-thumb"></div></div>
        <span class="t" id="t-total">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="ctl ctl-small" id="btn-cinema" title="Cinéma (vidéo)" aria-label="Cinéma">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9.5v5l4.5-2.5z"/></svg>
      </button>
      <button class="ctl ctl-small" id="btn-dl" title="Télécharger en local" aria-label="Télécharger">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 21h16"/></svg>
      </button>
      <button class="ctl ctl-small" id="btn-fav" title="Favori" aria-label="Favori">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.5-4.7-9.6-9.3C.8 8.4 2.8 4.5 6.6 4.1c2-.2 3.9.8 5.4 2.6 1.5-1.8 3.4-2.8 5.4-2.6 3.8.4 5.8 4.3 4.2 7.6C19.5 16.3 12 21 12 21z"/></svg>
      </button>
      <button class="ctl ctl-small" id="btn-queue" title="File d'attente" aria-label="File d'attente">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h13"/></svg>
      </button>
      <div class="vol">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a8 8 0 010 11"/></svg>
        <input id="volume" type="range" min="0" max="100" value="85" aria-label="Volume">
      </div>
    </div>
  </div>
</footer>

<!-- Toasts -->
<div id="toasts" class="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
