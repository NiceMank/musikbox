name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [v1, v2]
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        working-directory: mobile
        run: npm install

      - name: Add Android platform
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android manifest (permissions & cleartext)
        working-directory: mobile
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Manifest not found after cap sync"
            exit 1
          fi
          # grant Internet, local media read, media notification (Android 13+) & foreground audio service
          for P in "android.permission.INTERNET" \
                   "android.permission.ACCESS_NETWORK_STATE" \
                   "android.permission.READ_EXTERNAL_STORAGE" \
                   "android.permission.READ_MEDIA_AUDIO" \
                   "android.permission.WAKE_LOCK" \
                   "android.permission.POST_NOTIFICATIONS" \
                   "android.permission.FOREGROUND_SERVICE" \
                   "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" \
                   "android.permission.FOREGROUND_SERVICE_DATA_SYNC"; do
            if ! grep -q "$P" "$MANIFEST"; then
              sed -i "s|</manifest>|    <uses-permission android:name=\"$P\" />\n</manifest>|" "$MANIFEST"
            fi
          done
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true" /' "$MANIFEST"
          fi
          echo "--- Validate app id & package ---"
          grep -n "package=" "$MANIFEST" | head -1

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find mobile/android -name "*.apk" -path "*/debug/*" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          # fail visibly if no APK was actually produced
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::No APK produced by build"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusikBox-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
