<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07060b">
<title>MusikBox — Aether</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='30%25'%3E%3Cstop offset='0' stop-color='%23ffd76a'/%3E%3Cstop offset='1' stop-color='%23e79a1c'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/aether.css">
</head>
<body>
<canvas id="viz"></canvas>

<div id="app">
  <div id="view"></div>

  <!-- Mini player -->
  <div id="mini" class="hidden">
    <div class="m-cover"><span id="mini-ico">♪</span><img id="mini-cover" alt="" style="display:none"></div>
    <div class="m-meta">
      <div class="m-title" id="mini-title">—</div>
      <div class="m-sub" id="mini-sub"></div>
      <div class="m-prog"><i id="mini-prog"></i></div>
    </div>
    <button class="gbtn" id="mini-close" aria-label="close">✕</button>
    <button class="gbtn amber" id="mini-play" aria-label="play"></button>
  </div>

  <!-- Bottom navigation -->
  <nav id="dock"></nav>
</div>

<!-- Dream mode -->
<div id="dream" class="hidden">
  <canvas id="dream-canvas"></canvas>
  <div class="d-ui">
    <div class="d-meta">
      <div class="np-tag" id="dream-tag">Dream Mode</div>
      <div class="d-title" id="dream-title">—</div>
      <div class="d-sub" id="dream-sub"></div>
    </div>
    <div class="d-ctls">
      <button class="gbtn" id="dream-prev" aria-label="prev"></button>
      <button class="np-ctls bigplay" id="dream-play" aria-label="play"></button>
      <button class="gbtn" id="dream-next" aria-label="next"></button>
    </div>
    <div class="d-exit"><button class="btn" id="dream-exit">Exit</button></div>
  </div>
</div>

<!-- Sheet / modal -->
<div id="sheet-backdrop" class="backdrop hidden"></div>
<div id="sheet" class="sheet membrane hidden"></div>

<!-- Onboarding -->
<div id="ob" class="ob hidden"></div>

<div id="toasts"></div>

<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/player.js"></script>
<script src="js/api.js"></script>
<script src="js/scan.js"></script>
<script src="js/viz.js"></script>
<script src="js/app.js"></script>
</body>
</html>
