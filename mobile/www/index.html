<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MusikBox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar glass" id="sidebar">
    <a class="brand" href="#/">
      <span class="brand-disc" aria-hidden="true"></span>
      <span class="brand-text">Musik<em>Box</em></span>
    </a>
    <nav class="side-nav">
      <a href="#/" data-nav="home">Accueil</a>
      <a href="#/recherche" data-nav="recherche">Rechercher</a>
      <a href="#/bibliotheque" data-nav="bibliotheque">Ma bibliothèque <span id="lib-count" class="pill">0</span></a>
      <a href="#/favoris" data-nav="favoris">Favoris <span id="fav-count" class="pill">0</span></a>
      <a href="#/playlists" data-nav="playlists">Playlists</a>
      <a href="#/telechargements" data-nav="telechargements">Téléchargements <span id="dl-count" class="pill" hidden>0</span></a>
    </nav>
    <div class="side-foot">
      <div class="side-status"><span class="dot"></span> MusikBox mobile</div>
      <div class="side-note">Configurez l’API serveur si besoin (localStorage musikbox.api).</div>
    </div>
  </aside>
  <div class="main-col">
    <header class="topbar glass">
      <button class="icon-btn burger" id="burger" aria-label="Menu">☰</button>
      <form id="search-form" class="search glass-inset" autocomplete="off">
        <input id="search-input" type="search" placeholder="Rechercher sons, artistes, vidéos…" aria-label="Recherche">
        <div id="suggestions" class="suggest glass" hidden></div>
      </form>
    </header>
    <main id="view" class="container"></main>
  </div>
</div>
<div id="cinema" class="cinema" hidden>
  <div class="cinema-bar glass-strong">
    <div class="cinema-title"><span id="cinema-title" class="cinema-name">—</span></div>
    <div class="cinema-actions">
      <button class="icon-btn" id="cinema-close" title="Fermer">✕</button>
    </div>
  </div>
  <div class="cinema-stage glass-strong" id="cinema-stage"><video id="media" playsinline></video></div>
</div>
<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal glass-strong" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Fermer">✕</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="queue-panel" class="queue-panel glass-strong" hidden>
  <div class="queue-head">
    <strong>File d'attente</strong>
    <span id="queue-count" class="pill"></span>
    <button class="icon-btn" id="queue-clear" title="Vider">🗑</button>
    <button class="icon-btn" id="queue-close" aria-label="Fermer">✕</button>
  </div>
  <div id="queue-list" class="queue-list"></div>
</div>
<footer class="player" id="player" hidden>
  <div class="player-main">
    <div class="player-left">
      <div class="cover-wrap" id="cover-wrap"><img id="player-cover" alt="pochette"></div>
      <div class="player-meta">
        <div class="player-title" id="player-title">—</div>
        <div class="player-sub" id="player-sub"></div>
      </div>
    </div>
    <div class="player-center">
      <div class="controls">
        <button class="ctl" id="btn-prev" aria-label="Précédent">⏮</button>
        <button class="ctl ctl-play" id="btn-play" aria-label="Lecture">▶</button>
        <button class="ctl" id="btn-next" aria-label="Suivant">⏭</button>
      </div>
      <div class="timeline">
        <span class="t" id="t-current">0:00</span>
        <div class="bar" id="seek-bar"><div class="bar-fill" id="seek-fill"></div></div>
        <span class="t" id="t-total">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <button class="ctl ctl-small" id="btn-fav" aria-label="Favori">♥</button>
      <button class="ctl ctl-small" id="btn-queue" aria-label="File">☰</button>
      <div class="vol"><input id="volume" type="range" min="0" max="100" value="85" aria-label="Volume"></div>
    </div>
  </div>
</footer>
<div id="toasts" class="toasts"></div>
<script src="app.js"></script>
</body>
</html>
